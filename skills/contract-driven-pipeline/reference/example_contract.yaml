# Worked example for the skill — a small contract and (in pipeline_pattern.py) the pipeline
# the team expects for it. `contract_tools.py check` passes on this pair.
apiVersion: v3.0.2
kind: DataContract
id: 9b0e11d2-flight-legs
name: flight_legs
version: 1.0.0
status: active
domain: network
dataProduct: network-planning
description:
  purpose: Scheduled flight legs for network planning.
servers:
  - server: dev
    type: databricks
    catalog: example_catalog
    schema: network
team:
  - username: owner@example.com
    role: Data Product Owner
customProperties:
  - property: sourceFormat
    value: json
  - property: sourcePathConf
    value: network.landing_path
schema:
  - name: flight_legs
    physicalName: silver_flight_legs
    physicalType: table
    description: Typed scheduled flight legs.
    properties:
      - name: flight_number
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: public
        description: Carrier code + flight number.
        logicalTypeOptions:
          pattern: '^[A-Z0-9]{2}[0-9]{1,4}$'
      - name: departure_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        classification: public
        description: Scheduled departure (UTC).
      - name: seats
        logicalType: integer
        physicalType: INT
        required: false
        classification: internal
        description: Seats offered on the leg.
        logicalTypeOptions:
          minimum: 0
    quality:
      - name: departure_after_2000
        description: Sanity bound on departure dates.
        severity: warning
        type: custom
        engine: sql-predicate
        implementation: "departure_ts >= TIMESTAMP'2000-01-01'"
