# ODCS v3 data contract — the single specification for the cargo_shipments dataset.
# Demo data is fictional. Rules the pipeline must enforce live here, not in the code.
apiVersion: v3.0.2
kind: DataContract
id: 4f1c2a7e-cargo-shipments
name: cargo_shipments
version: 1.1.0
status: active
domain: cargo
dataProduct: cargo-operations
tenant: lhind-tech-connect-demo
description:
  purpose: >
    Air waybill (AWB) status events for cargo shipments, cleaned and typed,
    for operational dashboards and downstream capacity planning.
  usage: >
    One row per AWB status event. Consumers may join on awb_number.
    Shipper names are confidential and must not leave the cargo domain.
  limitations: >
    Events arrive at most once per file batch; late events up to 24 h are possible.

servers:
  - server: demo
    type: databricks
    environment: dev
    catalog: dlt_test
    schema: cargo

team:
  - username: merjan.shushollari@lhind.dlh.de
    role: Data Product Owner
  - username: nevis.ura@lhind.dlh.de
    role: Data Engineer

roles:
  - role: cargo_analysts
    access: read
  - role: cargo_engineers
    access: write

slaProperties:
  - property: latency
    value: 1
    unit: h
    element: cargo_shipments.event_ts
  - property: retention
    value: 2
    unit: y

customProperties:
  - property: sourceFormat
    value: json
  - property: sourcePathConf          # pipeline config key that holds the landing path
    value: cargo.landing_path
  - property: sourcePath              # landing location (environment-specific; setup/00 rewrites the catalog)
    value: /Volumes/dlt_test/cargo_landing/raw/shipments

schema:
  - name: cargo_shipments
    physicalName: silver_cargo_shipments
    physicalType: table
    businessName: Cargo shipment status events
    description: Typed, validated AWB status events.
    dataGranularityDescription: One row per AWB status event.
    tags: [cargo, awb, operational]
    properties:
      - name: awb_number
        businessName: Air waybill number
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
        description: IATA air waybill number, 3-digit airline prefix + 8-digit serial (e.g. 020-12345675).
        logicalTypeOptions:
          pattern: '^[0-9]{3}-[0-9]{8}$'
        examples: ['020-12345675']

      - name: status_code
        businessName: Status code
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        classification: public
        description: IATA Cargo-IMP status code (BKD, RCS, MAN, DEP, ARR, RCF, NFD, DLV).

      - name: event_ts
        businessName: Event timestamp
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        classification: public
        description: UTC timestamp at which the status event occurred.

      - name: origin_airport
        logicalType: string
        physicalType: STRING
        required: true
        classification: public
        description: IATA code of the origin airport.
        logicalTypeOptions:
          pattern: '^[A-Z]{3}$'

      - name: destination_airport
        logicalType: string
        physicalType: STRING
        required: true
        classification: public
        description: IATA code of the destination airport.
        logicalTypeOptions:
          pattern: '^[A-Z]{3}$'

      - name: flight_number
        logicalType: string
        physicalType: STRING
        required: false
        classification: public
        description: Carrier code + flight number of the leg, when known (e.g. LH8400).
        logicalTypeOptions:
          pattern: '^[A-Z0-9]{2}[0-9]{1,4}[A-Z]?$'

      - name: pieces
        logicalType: integer
        physicalType: INT
        required: true
        classification: public
        description: Number of pieces in the shipment.
        logicalTypeOptions:
          minimum: 1

      - name: weight_kg
        logicalType: number
        physicalType: DECIMAL(10,2)
        required: true
        classification: internal
        description: Gross weight in kilograms, as declared on the AWB.
        logicalTypeOptions:
          exclusiveMinimum: 0

      - name: commodity_description
        logicalType: string
        physicalType: STRING
        required: false
        classification: internal
        description: Free-text description of the goods.

      - name: dg_class
        businessName: Dangerous goods class
        logicalType: string
        physicalType: STRING
        required: false
        classification: internal
        tags: [dangerous_goods]
        description: IATA dangerous goods hazard class with optional division (e.g. 3, 2.1). Null for non-DG shipments.
        logicalTypeOptions:
          pattern: '^[1-9]([.][1-6])?$'

      - name: shipper_name
        logicalType: string
        physicalType: STRING
        required: false
        classification: confidential
        tags: [pii]
        description: Name of the shipping party. Confidential — mask for non-cargo consumers.

      - name: shipper_country
        logicalType: string
        physicalType: STRING
        required: false
        classification: internal
        description: ISO 3166-1 alpha-2 country code of the shipper.
        logicalTypeOptions:
          pattern: '^[A-Z]{2}$'

    quality:
      - name: valid_status_code
        description: Status must be a known Cargo-IMP code.
        dimension: conformity
        severity: error
        type: custom
        engine: sql-predicate
        implementation: "status_code IN ('BKD','RCS','MAN','DEP','ARR','RCF','NFD','DLV')"

      - name: awb_check_digit
        description: Last digit of the AWB serial is the first seven digits modulo 7.
        dimension: accuracy
        severity: error
        type: custom
        engine: sql-predicate
        implementation: "try_cast(substr(awb_number, 5, 7) AS BIGINT) % 7 = try_cast(substr(awb_number, 12, 1) AS INT)"

      - name: origin_differs_from_destination
        description: A shipment cannot fly to the airport it departs from.
        dimension: consistency
        severity: error
        type: custom
        engine: sql-predicate
        implementation: "origin_airport <> destination_airport"

      - name: event_not_in_future
        description: Events must not be more than one hour in the future (clock skew tolerance).
        dimension: timeliness
        severity: warning
        type: custom
        engine: sql-predicate
        implementation: "event_ts <= current_timestamp() + INTERVAL 1 HOUR"
